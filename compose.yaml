services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: uaway
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: uaway
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - uaway-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uaway"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build:
      context: .
      target: web
    env_file: .env
    environment:
      DATABASE_URL: postgres://uaway:local-development-only@db:5432/uaway
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
  worker:
    build:
      context: .
      target: worker
    env_file: .env
    environment:
      DATABASE_URL: postgres://uaway:local-development-only@db:5432/uaway
    depends_on:
      db:
        condition: service_healthy
volumes:
  uaway-data:
