name: Quality
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: uaway_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/uaway_test
      DATABASE_URL: postgres://postgres:test@localhost:5432/uaway_test
      AUTH_SECRET: ci-test-secret-isolated-from-production
      AUTH_GOOGLE_ID: test
      AUTH_GOOGLE_SECRET: test
      AUTH_EMAIL_FROM: test@example.invalid
      SMTP_HOST: smtp.example.invalid
      SMTP_USER: test
      SMTP_PASSWORD: test
      APP_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results
